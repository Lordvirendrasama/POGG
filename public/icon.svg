<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0b36"/>
      <stop offset="100%" stop-color="#05050f"/>
    </radialGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#9900ff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bgGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#221e4d" stroke-width="6"/>

  <!-- Field dividing neon line -->
  <line x1="40" y1="256" x2="472" y2="256" stroke="#00f0ff" stroke-width="4" stroke-dasharray="16 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#00f0ff" stroke-width="4" opacity="0.4"/>

  <!-- Top Striker (Magenta) -->
  <circle cx="256" cy="120" r="54" fill="url(#magentaGrad)" filter="url(#neonGlow)"/>
  <circle cx="256" cy="120" r="30" fill="#ffffff" opacity="0.9"/>

  <!-- Bottom Striker (Cyan) -->
  <circle cx="256" cy="392" r="54" fill="url(#cyanGrad)" filter="url(#neonGlow)"/>
  <circle cx="256" cy="392" r="30" fill="#ffffff" opacity="0.9"/>

  <!-- Kinetic Ball (Yellow Lightning) -->
  <circle cx="256" cy="256" r="28" fill="#ffe600" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>
</svg>
